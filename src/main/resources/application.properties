# ---------- Defaults = local development (H2 in-memory) ----------
server.port=8080
spring.datasource.url=jdbc:h2:mem:urbanserve;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Schema is created and versioned by Flyway (src/main/resources/db/migration), not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

server.error.include-message=always
server.error.include-stacktrace=never

# ---------- Auth ----------
# HMAC secret for JWTs (>= 32 chars). Blank = random per start (dev only: tokens die on restart).
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=24h
app.jwt.issuer=urbanserve
# Phones (10-digit) that get the ADMIN role, comma-separated.
app.admin-phones=${APP_ADMIN_PHONES:}

# OTP delivery: "log" prints the code to the server log (dev); "sns" sends SMS via Amazon SNS;
# "messagecentral" uses Message Central VerifyNow (sends + checks the code; no DLT registration of your own).
app.otp.sender=${APP_OTP_SENDER:log}
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=30s
app.otp.max-per-hour=5
# Optional SNS settings (India: sender ID + DLT entity/template IDs are required by TRAI for SMS)
app.otp.sns.sender-id=${APP_OTP_SNS_SENDER_ID:}
app.otp.sns.entity-id=${APP_OTP_SNS_ENTITY_ID:}
app.otp.sns.template-id=${APP_OTP_SNS_TEMPLATE_ID:}
app.otp.message=Your UrbanServe verification code is %s. It expires in 5 minutes. Do not share it.

# Message Central VerifyNow (app.otp.sender=messagecentral). Get the customer ID from the
# Message Central console. KEY = Base64 of your account password:  printf '%s' 'yourPassword' | base64
# Alternatively paste an authToken generated in the console into APP_OTP_MC_AUTH_TOKEN.
app.otp.messagecentral.base-url=${APP_OTP_MC_BASE_URL:https://cpaas.messagecentral.com}
app.otp.messagecentral.customer-id=${APP_OTP_MC_CUSTOMER_ID:}
app.otp.messagecentral.key=${APP_OTP_MC_KEY:}
app.otp.messagecentral.auth-token=${APP_OTP_MC_AUTH_TOKEN:}
# SMS or WHATSAPP
app.otp.messagecentral.flow-type=${APP_OTP_MC_FLOW_TYPE:SMS}
