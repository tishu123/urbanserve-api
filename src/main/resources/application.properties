# ---------- Defaults = local development (H2 in-memory) ----------
# Optional local settings file: put KEY=value lines (e.g. APP_OTP_MC_PASSWORD=...) in a file named
# .env in the folder you start the app from. It is git-ignored; see .env.example.
spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.datasource.url=jdbc:h2:mem:urbanserve;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Schema is created and versioned by Flyway (src/main/resources/db/migration), not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

server.error.include-message=always
server.error.include-stacktrace=never

# ---------- Auth ----------
# HMAC secret for JWTs (>= 32 chars). Blank = random per start (dev only: tokens die on restart).
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=24h
app.jwt.issuer=urbanserve
# Phones (10-digit) that get the ADMIN role, comma-separated.
app.admin-phones=${APP_ADMIN_PHONES:}

# OTP delivery: "log" prints the code to the server log (dev); "sns" sends SMS via Amazon SNS;
# "messagecentral" uses Message Central VerifyNow (sends + checks the code; no DLT registration of your own).
app.otp.sender=${APP_OTP_SENDER:log}
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=30s
app.otp.max-per-hour=5
# Optional SNS settings (India: sender ID + DLT entity/template IDs are required by TRAI for SMS)
app.otp.sns.sender-id=${APP_OTP_SNS_SENDER_ID:}
app.otp.sns.entity-id=${APP_OTP_SNS_ENTITY_ID:}
app.otp.sns.template-id=${APP_OTP_SNS_TEMPLATE_ID:}
app.otp.message=Your UrbanServe verification code is %s. It expires in 5 minutes. Do not share it.

# Message Central VerifyNow (app.otp.sender=messagecentral). Customer ID is from the Message Central
# console. Give your account password in APP_OTP_MC_PASSWORD (plain), or APP_OTP_MC_KEY (Base64 of it),
# or an authToken generated in the console in APP_OTP_MC_AUTH_TOKEN. Keep these in .env, not here.
app.otp.messagecentral.base-url=${APP_OTP_MC_BASE_URL:https://cpaas.messagecentral.com}
app.otp.messagecentral.customer-id=${APP_OTP_MC_CUSTOMER_ID:C-DC8D1C144CA446C}
app.otp.messagecentral.password=${APP_OTP_MC_PASSWORD:}
app.otp.messagecentral.key=${APP_OTP_MC_KEY:}
app.otp.messagecentral.auth-token=${APP_OTP_MC_AUTH_TOKEN:}
# SMS or WHATSAPP
app.otp.messagecentral.flow-type=${APP_OTP_MC_FLOW_TYPE:SMS}

# ---------- Dispatch (urbanserve-dispatch assigns a free professional) ----------
# "sqs" = send bookings to dispatch over Amazon SQS (ElasticMQ locally); "none" = not connected
# (bookings stay PENDING). Queue URLs come from Terraform outputs on AWS, or from the local
# docker compose (see .env.example).
app.dispatch.transport=${APP_DISPATCH_TRANSPORT:none}
app.dispatch.sqs.endpoint=${APP_SQS_ENDPOINT:}
app.dispatch.sqs.region=${AWS_REGION:ap-south-1}
app.dispatch.sqs.booking-requested-url=${APP_SQS_BOOKING_REQUESTED_URL:}
app.dispatch.sqs.booking-cancelled-url=${APP_SQS_BOOKING_CANCELLED_URL:}
app.dispatch.sqs.booking-assignment-url=${APP_SQS_BOOKING_ASSIGNMENT_URL:}
app.dispatch.relay-interval=PT2S

# Booking API to Payment Service connection.
app.payment.base-url=${PAYMENT_SERVICE_BASE_URL:http://127.0.0.1:8081}
app.payment.internal-token=${PAYMENT_INTERNAL_TOKEN:}

